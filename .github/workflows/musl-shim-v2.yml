name: Musl shim v2 - prebuilt glibc V8 + compat layer

on:
  workflow_dispatch:

env:
  TARGET: aarch64-linux-musl

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightpanda-io/browser
          fetch-depth: 0

      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils ca-certificates clang make git binutils

      - uses: mlugg/setup-zig@v2

      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Download prebuilt V8 (glibc aarch64)
        run: |
          mkdir -p v8
          wget -O v8/libc_v8.a https://github.com/lightpanda-io/zig-v8-fork/releases/download/v0.5.2/libc_v8_14.9.207.35_linux_aarch64.a
          ls -la v8/

      - name: Build musl compat shim and inject into V8 archive
        run: |
          echo '' | base64 -d > v8_compat.c
          head -3 v8_compat.c
          zig cc -c v8_compat.c -o v8_compat.o -target ${{ env.TARGET }} -O2
          echo "shim compiled:"
          ls -la v8_compat.o
          cp v8/libc_v8.a v8/libc_v8_orig.a
          ar rcs v8/libc_v8.a v8_compat.o
          echo "shim injected into libc_v8.a"

      - name: v8 snapshot (musl target)
        run: |
          sudo apt-get install -y gdb > /dev/null 2>&1 || true
          zig build -Dprebuilt_v8_path=v8/libc_v8.a -Dtarget=${{ env.TARGET }} -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin 2>&1 | tail -8
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            BIN=$(find .zig-cache -name "lightpanda-snapshot-creator" -type f | head -1)
            echo "=== binary: $BIN ==="
            if [ -n "$BIN" ]; then
              echo "=== gdb backtrace ==="
              gdb -batch -ex "set pagination off" -ex run -ex "bt 25" -ex "info registers pc sp" --args "$BIN" src/snapshot.bin 2>&1 | tail -45
            fi
            exit $RC
          fi

      - name: zig build (musl + shimmed V8)
        run: |
          zig build -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a \
            -Dtarget=${{ env.TARGET }} \
            -Doptimize=ReleaseFast \
            -Dcpu=generic \
            -Dversion=musl-build 2>&1 | tail -40

      - name: Verify linkage
        run: |
          echo "=== NEEDED ==="
          readelf -d zig-out/bin/lightpanda | grep NEEDED || echo "(no NEEDED - fully static!)"
          echo "=== INTERP ==="
          readelf -l zig-out/bin/lightpanda | grep INTERP || echo "(no INTERP - fully static!)"
          file zig-out/bin/lightpanda

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-aarch64-musl-shim
          path: zig-out/bin/lightpanda
          retention-days: 14
