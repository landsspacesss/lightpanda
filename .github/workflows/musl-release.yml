name: Build musl Lightpanda (arm64 + x86_64) & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.2.6-musl)'
        required: true
        default: 'musl-test-1'
      upstream_ref:
        description: 'Upstream lightpanda-io/browser ref (tag/branch/sha) to build. Default: main'
        required: false
        default: 'main'
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: 'true'
  # Allow the auto-trigger workflow (and other workflows) to call this.
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      upstream_ref:
        required: false
        type: string
        default: 'main'
      prerelease:
        required: false
        type: string
        default: 'true'

permissions:
  contents: write

env:
  TARGET_ARM: aarch64-linux-musl
  TARGET_X64: x86_64-linux-musl
  # Number of attempts for the flaky V8 fetch/build (chromium.googlesource.com
  # occasionally returns HTTP 400 / "expected 'packfile'" during gclient sync).
  V8_BUILD_ATTEMPTS: '3'

jobs:
  # ============ Job A: V8 x86_64 musl ============
  build-v8-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightpanda-io/zig-v8-fork
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -yq libglib2.0-dev lld wget ca-certificates
      - name: Cache V8 x64 build
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .lp-cache
            libc_v8_musl_x64.a
          key: v8-musl-x64-${{ github.run_id }}
          restore-keys: |
            v8-musl-x64-
      - name: Git resilience for chromium fetches
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
      - name: Build V8 x64 (musl)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for i in $(seq 1 "$V8_BUILD_ATTEMPTS"); do
            echo "=== V8 x64 build attempt $i/$V8_BUILD_ATTEMPTS ==="
            if zig build -Dtarget="${{ env.TARGET_X64 }}" -Doptimize=ReleaseSafe build-v8; then
              echo "V8 x64 build succeeded on attempt $i"; exit 0
            fi
            echo "attempt $i failed; clearing partial checkouts and retrying"
            find .lp-cache -type d -name _bad_scm -prune -exec rm -rf {} + 2>/dev/null || true
            sleep 20
          done
          echo "V8 x64 build failed after $V8_BUILD_ATTEMPTS attempts"; exit 1
      - name: Pack V8 lib
        run: |
          if [ ! -f libc_v8_musl_x64.a ]; then
            V8_LIB=$(find .lp-cache -name "libc_v8.a" 2>/dev/null | head -1)
            [ -z "$V8_LIB" ] && V8_LIB=$(find . -name "libc_v8.a" 2>/dev/null | head -1)
            cp "$V8_LIB" libc_v8_musl_x64.a
          fi
          ls -la libc_v8_musl_x64.a
      - name: Upload V8 x64 lib
        uses: actions/upload-artifact@v4
        with:
          name: libc_v8_musl_x64
          path: libc_v8_musl_x64.a
          retention-days: 7

  # ============ Job B: V8 aarch64 musl (缓存命中) ============
  build-v8-arm:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightpanda-io/zig-v8-fork
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -yq libglib2.0-dev lld wget ca-certificates
          wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
          sudo ./llvm.sh 23 || echo "llvm.sh 失败,继续"
          CLANG_DIR=/usr/lib/llvm-23/lib/clang/23
          sudo ln -nsf "$CLANG_DIR/lib/linux/libclang_rt.builtins-aarch64.a" "$CLANG_DIR/lib/linux/libclang_rt.builtins.a" || true
          sudo ln -nsf "$CLANG_DIR/lib/linux" "$CLANG_DIR/lib/aarch64-unknown-linux-gnu" || true
      - name: Cache V8 arm build
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .lp-cache
            libc_v8_musl_arm.a
          key: v8-musl-arm-${{ github.run_id }}
          restore-keys: |
            v8-musl-
      - name: Git resilience for chromium fetches
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
      - name: Build V8 arm (musl)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for i in $(seq 1 "$V8_BUILD_ATTEMPTS"); do
            echo "=== V8 arm build attempt $i/$V8_BUILD_ATTEMPTS ==="
            if zig build -Dtarget="${{ env.TARGET_ARM }}" -Doptimize=ReleaseSafe build-v8; then
              echo "V8 arm build succeeded on attempt $i"; exit 0
            fi
            echo "attempt $i failed; clearing partial checkouts and retrying"
            find .lp-cache -type d -name _bad_scm -prune -exec rm -rf {} + 2>/dev/null || true
            sleep 20
          done
          echo "V8 arm build failed after $V8_BUILD_ATTEMPTS attempts"; exit 1
      - name: Pack V8 lib
        run: |
          if [ ! -f libc_v8_musl_arm.a ]; then
            V8_LIB=$(find .lp-cache -name "libc_v8.a" 2>/dev/null | head -1)
            [ -z "$V8_LIB" ] && V8_LIB=$(find . -name "libc_v8.a" 2>/dev/null | head -1)
            cp "$V8_LIB" libc_v8_musl_arm.a
          fi
          ls -la libc_v8_musl_arm.a
      - name: Upload V8 arm lib
        uses: actions/upload-artifact@v4
        with:
          name: libc_v8_musl_arm
          path: libc_v8_musl_arm.a
          retention-days: 7

  # ============ Job C: Lightpanda x86_64 musl ============
  build-lp-x64:
    needs: build-v8-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightpanda-io/browser
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 0
      - name: Install apt deps
        run: sudo apt-get update && sudo apt-get install -y wget xz-utils ca-certificates clang make git binutils
      - uses: mlugg/setup-zig@v2
      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Fetch musl V8 x64
        uses: actions/download-artifact@v4
        with:
          name: libc_v8_musl_x64
          path: v8/
      - name: Prepare v8 dir
        run: |
          mkdir -p v8
          ls -la v8/
          [ -f v8/libc_v8.a ] || find / -name "libc_v8_musl_x64.a" 2>/dev/null | head -1 | xargs -I{} cp {} v8/libc_v8.a
      - name: Inject musl compat shim
        run: |
          echo '' | base64 -d > v8_compat.c
          head -3 v8_compat.c
          zig cc -c v8_compat.c -o v8_compat.o -target ${{ env.TARGET_X64 }} -O2
          cp v8/libc_v8.a v8/libc_v8_orig.a
          ar rcs v8/libc_v8.a v8_compat.o
          echo "shim injected (x64)"
      - name: v8 snapshot (x64 musl)
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Dtarget=${{ env.TARGET_X64 }} -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin
      - name: zig build (x64 musl static)
        run: |
          zig build -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a \
            -Dtarget=${{ env.TARGET_X64 }} \
            -Doptimize=ReleaseFast -Dcpu=x86_64 -Dversion=musl-build 2>&1 | tail -30
      - name: Verify
        run: |
          readelf -d zig-out/bin/lightpanda | grep NEEDED || echo "fully static!"
          file zig-out/bin/lightpanda
          mv zig-out/bin/lightpanda lightpanda-x86_64-musl
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-x86_64-musl
          path: lightpanda-x86_64-musl
          retention-days: 7

  # ============ Job D: Lightpanda aarch64 musl ============
  build-lp-arm:
    needs: build-v8-arm
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightpanda-io/browser
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 0
      - name: Install apt deps
        run: sudo apt-get update && sudo apt-get install -y wget xz-utils ca-certificates clang make git binutils
      - uses: mlugg/setup-zig@v2
      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Fetch musl V8 arm
        uses: actions/download-artifact@v4
        with:
          name: libc_v8_musl_arm
          path: v8/
      - name: Prepare v8 dir
        run: |
          mkdir -p v8
          ls -la v8/
          [ -f v8/libc_v8.a ] || find / -name "libc_v8_musl_arm.a" 2>/dev/null | head -1 | xargs -I{} cp {} v8/libc_v8.a
      - name: Inject musl compat shim
        run: |
          echo '' | base64 -d > v8_compat.c
          head -3 v8_compat.c
          zig cc -c v8_compat.c -o v8_compat.o -target ${{ env.TARGET_ARM }} -O2
          cp v8/libc_v8.a v8/libc_v8_orig.a
          ar rcs v8/libc_v8.a v8_compat.o
          echo "shim injected (arm)"
      - name: v8 snapshot (arm musl)
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Dtarget=${{ env.TARGET_ARM }} -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin
      - name: zig build (arm musl static)
        run: |
          zig build -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a \
            -Dtarget=${{ env.TARGET_ARM }} \
            -Doptimize=ReleaseFast -Dcpu=generic -Dversion=musl-build 2>&1 | tail -30
      - name: Verify
        run: |
          readelf -d zig-out/bin/lightpanda | grep NEEDED || echo "fully static!"
          file zig-out/bin/lightpanda
          mv zig-out/bin/lightpanda lightpanda-aarch64-musl
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-aarch64-musl
          path: lightpanda-aarch64-musl
          retention-days: 7

  # ============ Job E: 发布 Release ============
  release:
    needs: [build-lp-x64, build-lp-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download both binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Inspect assets
        run: |
          ls -la release-assets/
          file release-assets/lightpanda-*-musl 2>/dev/null || true
      - name: Create Release & upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Lightpanda musl build ${{ inputs.release_tag }}"
          body: |
            Static musl builds of Lightpanda (zero-dependency, works on Alpine/musl systems).
            - Built from upstream `lightpanda-io/browser` ref: `${{ inputs.upstream_ref }}`
            - arm64 (aarch64-linux-musl)
            - x86_64 (x86_64-linux-musl)
          files: release-assets/lightpanda-*-musl
          prerelease: ${{ inputs.prerelease == 'true' }}
