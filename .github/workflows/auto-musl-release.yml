name: Auto-build musl on new upstream tag

# Upstream tags do NOT propagate to a fork, so we poll upstream on a schedule.
# When a new semver tag appears and we haven't released "<tag>-musl" yet, we run
# the musl build for that exact upstream tag.
#
# The build is invoked as a REUSABLE workflow (`uses:`) rather than dispatched
# with `gh workflow run`: a dispatch made with the default GITHUB_TOKEN does not
# start a new workflow run (GitHub blocks token-triggered recursion), so `uses:`
# is the only reliable way to chain them.
#
# Force a check now: Actions tab -> "Auto-build musl on new upstream tag" -> Run workflow.

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      exists: ${{ steps.rel.outputs.exists }}
    steps:
      - name: Find latest upstream semver tag
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/lightpanda-io/browser/tags --paginate --jq '.[].name' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "latest upstream semver tag: ${TAG:-<none>}"
          [ -n "$TAG" ] || { echo "no semver tag found upstream"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether we already released it
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}-musl"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release $TAG not found — will build"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: detect
    if: needs.detect.outputs.exists == 'false'
    uses: ./.github/workflows/musl-release.yml
    with:
      release_tag: ${{ needs.detect.outputs.tag }}-musl
      upstream_ref: ${{ needs.detect.outputs.tag }}
      prerelease: 'true'
    permissions:
      contents: write
