name: Musl shim attempt - prebuilt glibc V8 + compat layer

on:
  workflow_dispatch:

env:
  TARGET: aarch64-linux-musl

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightpanda-io/browser
          fetch-depth: 0

      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils ca-certificates clang make git binutils

      - uses: mlugg/setup-zig@v2

      - name: Zig zip-fetch workaround
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Download prebuilt V8 (glibc aarch64)
        run: |
          mkdir -p v8
          wget -O v8/libc_v8.a https://github.com/lightpanda-io/zig-v8-fork/releases/download/v0.5.2/libc_v8_14.9.207.35_linux_aarch64.a
          ls -la v8/

      - name: Build musl compat shim and inject into V8 archive
        run: |
          cat > v8_compat.c <<'XEOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <dirent.h>
          #include <wchar.h>

          int open64(const char *path, int flags, ...) {
              va_list ap; va_start(ap, flags);
              mode_t mode = va_arg(ap, mode_t);
              va_end(ap);
              return open(path, flags, mode);
          }
          ssize_t pread64(int fd, void *buf, size_t count, off_t offset) { return pread(fd, buf, count, offset); }
          int ftruncate64(int fd, off_t length) { return ftruncate(fd, length); }
          int fstat64(int fd, struct stat *st) { return fstat(fd, st); }
          void *mmap64(void *addr, size_t len, int prot, int flags, int fd, off_t off) { return mmap(addr, len, prot, flags, fd, off); }
          struct dirent *readdir64(DIR *dirp) { return readdir(dirp); }
          FILE *fopen64(const char *path, const char *mode) { return fopen(path, mode); }
          int stat64(const char *path, struct stat *st) { return stat(path, st); }
          FILE *tmpfile64(void) { return tmpfile(); }
          int fseeko64(FILE *s, off_t off, int whence) { return fseeko(s, off, whence); }
          off_t ftello64(FILE *s) { return ftello(s); }
          off_t lseek64(int fd, off_t off, int whence) { return lseek(fd, off, whence); }

          int __vsnprintf_chk(char *s, size_t maxlen, int flag, size_t slen, const char *fmt, va_list ap) {
              (void)flag; (void)slen;
              return vsnprintf(s, maxlen, fmt, ap);
          }
          int __vfprintf_chk(FILE *stream, int flag, const char *fmt, va_list ap) {
              (void)flag;
              return vfprintf(stream, fmt, ap);
          }

          void *__libc_stack_end = 0;
          long __sysconf(int name) { return sysconf(name); }
          size_t __mbrlen(const char *s, size_t n, mbstate_t *ps) { return mbrlen(s, n, ps); }

          int backtrace(void **buffer, int size) { (void)buffer; (void)size; return 0; }
          void backtrace_symbols_fd(void *const *buffer, int size, int fd) { (void)buffer; (void)size; (void)fd; }
          char **backtrace_symbols(void *const *buffer, int size) { (void)buffer; (void)size; return 0; }
          XEOF
          zig cc -c v8_compat.c -o v8_compat.o -target ${{ env.TARGET }} -O2
          echo "compiled shim:"
          ls -la v8_compat.o
          cp v8/libc_v8.a v8/libc_v8_orig.a
          ar rcs v8/libc_v8.a v8_compat.o
          echo "shim injected into libc_v8.a"

      - name: v8 snapshot (musl target)
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Dtarget=${{ env.TARGET }} -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: zig build (musl + shimmed V8)
        run: |
          zig build -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a \
            -Dtarget=${{ env.TARGET }} \
            -Doptimize=ReleaseFast \
            -Dcpu=generic \
            -Dversion=musl-build 2>&1 | tail -40

      - name: Verify linkage
        run: |
          echo "=== NEEDED ==="
          readelf -d zig-out/bin/lightpanda | grep NEEDED || echo "(no NEEDED - fully static!)"
          echo "=== INTERP ==="
          readelf -l zig-out/bin/lightpanda | grep INTERP || echo "(no INTERP - fully static!)"
          file zig-out/bin/lightpanda

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-aarch64-musl-shim
          path: zig-out/bin/lightpanda
          retention-days: 14
